name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest
      - name: Offline demo
        run: python demo/run_demo.py
      - name: Demo output matches the committed capture, byte for byte
        run: git diff --exit-code -- demo/output.txt
